[build]
  command = "npm ci && npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24.19.0"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
